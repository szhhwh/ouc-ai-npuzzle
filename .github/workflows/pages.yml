name: Publish puzzle visualization

on:
  push:
    branches: [main]
    paths:
      - 'visualization/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage latest website assets only
        run: |
          mkdir -p "${{ runner.temp }}/npuzzle-pages"
          for asset in index.html search-studio.css search-studio.js library.js app.js navigation.js; do
            cp "visualization/$asset" "${{ runner.temp }}/npuzzle-pages/$asset"
          done
      - name: Upload visualization
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/npuzzle-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
