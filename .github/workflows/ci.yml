name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Quality Gates (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with quality gates (compile + Spotless + SpotBugs)
        run: ./mvnw -B -ntp verify

      - name: Pathfinding smoke test
        run: |
          set -o pipefail
          java -cp target/classes core.runner.SearchTester \
            resources/pathfinding.txt stud.runner.WalkerFeeder astar PF_GRID,PF_EUCLID | tee smoke.log
          # pathfinding.txt 含 6 个实例，应全部求得解路径
          test "$(grep -c '解路径长度' smoke.log)" -ge 6
