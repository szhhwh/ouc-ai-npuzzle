name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Quality Gates (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java (compile + Spotless + SpotBugs)
        run: ./mvnw -B -ntp verify

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: visualization
        run: bun run test

      - name: Build frontend
        working-directory: visualization
        run: bun run build
