<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>N-Puzzle · 搜索算法可视化</title>
    <link rel="stylesheet" href="search-studio.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="header-navigation">
        <a class="brand" href="./">N<span>·</span>PUZZLE</a>
        <div class="tab-nav" role="tablist" aria-label="可视化视图">
          <button
            id="tab-button-overview"
            class="tab-btn active"
            type="button"
            role="tab"
            aria-controls="tab-overview"
            aria-selected="true"
          >
            路径演示
          </button>
          <button
            id="tab-button-studio"
            class="tab-btn"
            type="button"
            role="tab"
            aria-controls="tab-studio"
            aria-selected="false"
            tabindex="-1"
          >
            算法过程
          </button>
        </div>
      </div>
      <div class="header-actions">
        <a
          class="header-link"
          href="https://github.com/szhhwh/ouc-ai-npuzzle"
          target="_blank"
          rel="noreferrer"
          >项目仓库 ↗</a
        >
        <button id="cinema" type="button" aria-pressed="false">录屏布局</button>
      </div>
    </header>

    <main>
      <div
        id="tab-overview"
        class="tab-content"
        role="tabpanel"
        aria-labelledby="tab-button-overview"
        tabindex="-1"
      >
        <div class="workspace">
          <section class="board-panel" aria-label="解路径演示">
            <div class="panel-label">
              解路径演示 <span class="tag">8-PUZZLE</span>
            </div>
            <div id="board" class="board" aria-label="数码棋盘"></div>

            <div class="transport path-transport">
              <button
                id="reset"
                type="button"
                title="回到起点"
                aria-label="回到起点"
              >
                ↺
              </button>
              <button
                id="prev"
                type="button"
                title="上一步"
                aria-label="上一步"
              >
                ←
              </button>
              <button id="play" class="play" type="button">
                ▶ <span>播放路径</span>
              </button>
              <button
                id="next"
                type="button"
                title="下一步"
                aria-label="下一步"
              >
                →
              </button>
              <select id="speed" aria-label="路径播放速度">
                <option value="1000">0.5×</option>
                <option value="500" selected>1×</option>
                <option value="250">2×</option>
              </select>
            </div>
            <div class="timeline-label">
              <span>路径进度</span>
              <span><b id="step">00</b> / <span id="total">21</span> 步</span>
            </div>
            <input
              id="progress"
              type="range"
              min="0"
              max="21"
              value="0"
              aria-label="跳转到指定步数"
            />
          </section>

          <aside class="overview-sidebar">
            <section class="settings">
              <h2>探索设置</h2>
              <label for="sample">选择实例</label>
              <select id="sample">
                <option value="imported" disabled>已导入的路径</option>
                <option value="0">课程实例 01 · 21 步</option>
                <option value="1">课程实例 02 · 31 步</option>
                <option value="2">课程实例 03 · 31 步</option>
              </select>

              <label>搜索算法</label>
              <div class="algorithm">
                <span id="algorithm-name">A*</span>
                <span id="algorithm-tag" class="tiny-tag">最优搜索</span>
              </div>
              <label>启发函数（内置演示设置）</label>
              <div class="segmented" role="group" aria-label="路径启发函数">
                <button id="manhattan" class="selected" type="button">
                  曼哈顿距离
                </button>
                <button id="misplaced" type="button">错位将牌数</button>
              </div>
              <button id="solve" class="solve" type="button">
                重新求解 <span>↗</span>
              </button>
              <button id="import" class="import" type="button">
                ＋ 导入 Java 解路径 JSON
              </button>
              <input
                id="file"
                type="file"
                accept="application/json,.json"
                hidden
              />
              <p id="message" class="message" role="status"></p>
            </section>

            <section class="metrics">
              <div class="metrics-heading">
                <h2>搜索记录</h2>
                <span id="source">浏览器 A* 演示</span>
              </div>
              <div class="metric-grid">
                <div>
                  <span>解路径长度</span>
                  <strong id="length">—<small>步</small></strong>
                </div>
                <div>
                  <span>求解耗时</span>
                  <strong id="time">—<small>ms</small></strong>
                </div>
                <div>
                  <span>生成节点</span> <strong id="generated">—</strong>
                </div>
                <div>
                  <span>扩展节点</span> <strong id="expanded">—</strong>
                </div>
              </div>
            </section>
          </aside>
        </div>
      </div>

      <div
        id="tab-studio"
        class="tab-content"
        role="tabpanel"
        aria-labelledby="tab-button-studio"
        tabindex="-1"
        hidden
      >
        <section class="controls" aria-label="演示设置">
          <label
            >实例
            <select id="preset">
              <option value="0">入门 · 2 步</option>
              <option value="1" selected>分支探索 · 8 步</option>
              <option value="2">课程实例 · 前 80 轮</option>
            </select>
          </label>
          <label
            >启发函数
            <select id="heuristic">
              <option value="MANHATTAN">曼哈顿距离</option>
              <option value="MISPLACED">错位数</option>
            </select>
          </label>
          <label
            >节奏
            <select id="speed-studio">
              <option value="1800">细讲</option>
              <option value="1000" selected>标准</option>
              <option value="350">快览</option>
            </select>
          </label>
          <button id="restart" type="button">↺ 重来</button>
        </section>

        <section class="film" aria-label="A* 算法动画">
          <div class="narration">
            <span id="shot-tag">起点</span>
            <h2 id="headline">将起点放入 Open。</h2>
            <p id="explanation-studio" role="status"></p>
          </div>
          <aside class="inspector">
            <h3 id="inspect-title">起点 #0</h3>
            <div
              id="focus-board"
              class="focus-board"
              aria-label="当前查看的棋盘"
            ></div>
            <div class="equation" aria-label="节点权值">
              <div class="g"><small>已走 g</small><b id="cost-g">0</b></div>
              <span>+</span>
              <div class="h"><small>估计 h</small><b id="cost-h">8</b></div>
              <span>=</span>
              <div class="f"><small>权值 f</small><b id="cost-f">8</b></div>
            </div>
          </aside>
          <section class="tree-panel" aria-label="搜索树">
            <div class="panel-heading">
              <h3>搜索树</h3>
              <div class="tree-tools">
                <label><input id="pruned" type="checkbox" />显示剪枝</label>
                <button id="fit-tree" type="button">缩览树</button>
                <button id="actual-tree" class="active" type="button">
                  原始比例
                </button>
              </div>
            </div>
            <div id="tree-viewport" class="tree-viewport">
              <svg
                id="search-tree"
                role="img"
                aria-label="逐步展开的 Java 搜索树"
              ></svg>
            </div>
          </section>
          <div class="transport studio-transport">
            <button id="previous" type="button">← 上一步</button>
            <button id="play-studio" class="primary" type="button">
              ▶ 播放算法
            </button>
            <button id="next-studio" type="button">下一步 →</button>
            <span id="position"></span>
            <input
              id="timeline"
              type="range"
              min="0"
              value="0"
              aria-label="动画进度"
            />
          </div>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
    <script src="java-search-traces.js"></script>
    <script src="search-studio.js"></script>
    <script src="navigation.js"></script>
  </body>
</html>
